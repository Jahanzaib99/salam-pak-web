<section id="slider1" class="slider slider-1 hero-video-section">
  <div class="hero-video-wrapper">
    <div class="hero-video-container">
      <video
        #homeslider
        class="hero-video"
        width="100%"
        preload="true"
        loop
        muted
        autoplay
        playsinline
        oncanplay="this.play()"
        onloadedmetadata="this.muted = true"
      >
        <source src="assets/videos/SalamPakistan4k.mp4" type="video/mp4" />
        <source src="assets/videos/Homepage.mp4" type="video/mp4" />
      </video>
      <div class="hero-video-overlay"></div>
    </div>
    
    <!-- Hero Content Overlay -->
    <div class="hero-content-wrapper">
      <div class="container">
        <div class="row">
          <div class="col-12">
            <div class="hero-content">
              <!-- <h1 class="hero-title">
                <span class="hero-country">Pakistan</span>
              </h1>
              <p class="hero-description" [translate]="'HOMESLIDETEXT1'">
                Your gateway to a realm of incredible beauty, warm hospitality, exquisite food & endless discovery.
              </p> -->
              <div class="hero-actions">
                <a
                  *ngIf="show"
                  href="#visa"
                  class="btn btn-hero-primary"
                >
                  <span>APPLY E-VISA</span>
                </a>
                <a
                  href="#explore"
                  class="btn btn-hero-secondary"
                >
                  <span>EXPLORE PAKISTAN</span>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<!-- /.slider -->
