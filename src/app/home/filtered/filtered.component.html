<section class="where-to-go-section">
  <!-- Dynamic blurred background that changes with active card -->
  <div
    class="section-dynamic-bg"
    [style.background-image]="'url(' + currentBgImage + ')'"
  ></div>
  <div class="section-bg-overlay"></div>

  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <div class="section-header-wrapper">
          <div class="section-header">
            <h2 class="heading__title">{{ title }} - As Per Your Interest</h2>
          </div>
          <a 
            *ngIf="title === 'Where To Go'"
            [routerLink]="['/where-to-go']"
            class="view-all-btn"
          >
            View All
          </a>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-12">
        <div class="trail-carousel-wrapper" *ngIf="singleFilter && singleFilter.length > 0">
          <!-- Navigation Arrow - Prev -->
          <button 
            class="trail-nav-btn trail-nav-prev" 
            (click)="scrollCards('prev')"
            [disabled]="!canScrollPrev()"
            aria-label="Previous"
          >
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <div class="trail-cards-container">
            <div
              *ngFor="let single of singleFilter; let i = index"
              class="trail-card-wrapper"
              [class.is-active]="i === currentIndex"
              [style.z-index]="isCardVisible(i) ? getCardZIndex(i) : 0"
              [style.transform]="getCardTransform(i)"
              [style.opacity]="isCardVisible(i) ? 1 : 0"
              [style.pointer-events]="isCardVisible(i) ? 'auto' : 'none'"
            >
              <div class="trail-card" (click)="navigate(single)">
                <div class="trail-card-image">
                  <img
                    [src]="single.thumbnail || 'assets/images/home/beaches.webp'"
                    [alt]="single.alias"
                    onerror="this.onerror=null;this.src='assets/images/home/beaches.png';"
                  />
                  <div class="trail-card-overlay"></div>
                  <div class="trail-card-content">
                    <h4 class="trail-card-title">{{ single.alias }}</h4>
                    <button class="trail-explore-btn">EXPLORE</button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Navigation Arrow - Next -->
          <button 
            class="trail-nav-btn trail-nav-next" 
            (click)="scrollCards('next')"
            [disabled]="!canScrollNext()"
            aria-label="Next"
          >
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
